# Builds the Windows agent installer on GitHub's own Windows machine (free for this repository) and publishes
# it as a GitHub release. Run it by pushing a version tag, e.g.  git tag v0.8.3 && git push origin v0.8.3
# (the tag must match agent/app/__init__.py), or by hand from the Actions tab (that only uploads the file).
name: Agent installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the release and attach the installer

jobs:
  build:
    name: Build WorkPulseAgentSetup
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: version
        run: |
          $v = (Select-String -Path app/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match the agent version $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Install
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt pyinstaller==6.22.3
      - name: Inno Setup
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and
              -not (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build (tests, bundle, smoke test, installer)
        run: ./packaging/build.ps1 -Installer -Production
      - name: Fingerprint (SHA-256)
        id: hash
        run: |
          $h = (Get-FileHash "dist/WorkPulseAgentSetup-${{ steps.version.outputs.version }}.exe" -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" >> $env:GITHUB_OUTPUT
          Write-Host "AGENT_SHA256 = $h"
      - name: Silent install, as an automatic update runs it
        run: |
          $setup = "dist/WorkPulseAgentSetup-${{ steps.version.outputs.version }}.exe"
          # Wait for the installer only: Start-Process -Wait would also wait for the agent it starts, forever.
          $install = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CLOSEAPPLICATIONS","/AUTOUPDATE=1" -PassThru
          if (-not $install.WaitForExit(300000)) { throw "The silent install did not finish in 5 minutes" }
          if ($install.ExitCode -ne 0) { throw "The silent install failed (exit code $($install.ExitCode))" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\WorkPulse\WorkPulseAgent.exe"
          if (-not (Test-Path $exe)) { throw "The silent install did not put the agent in place" }
          $run = Start-Process $exe -ArgumentList "--version" -PassThru
          if (-not $run.WaitForExit(60000)) { throw "The installed agent did not answer --version" }
          if ($run.ExitCode -ne 0) { throw "The installed agent failed to run (exit code $($run.ExitCode))" }
          Write-Host "Installed agent runs"
          $started = $false
          for ($i = 0; $i -lt 30 -and -not $started; $i++) { Start-Sleep 1; $started = [bool](Get-Process WorkPulseAgent -ErrorAction SilentlyContinue) }
          if ($started) { Write-Host "The installer started the new agent after the update" } else { Write-Warning "The agent did not start after the silent install (no desktop session on this machine?)" }
          Get-Process WorkPulseAgent -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Install over a running agent (the installer must close it itself)
        run: |
          $setup = "dist/WorkPulseAgentSetup-${{ steps.version.outputs.version }}.exe"
          $exe = Join-Path $env:LOCALAPPDATA "Programs\WorkPulse\WorkPulseAgent.exe"
          Start-Process $exe -ArgumentList "--minimized"
          $up = $false
          for ($i = 0; $i -lt 20 -and -not $up; $i++) { Start-Sleep 1; $up = [bool](Get-Process WorkPulseAgent -ErrorAction SilentlyContinue) }
          if (-not $up) { Write-Warning "Could not start an agent to install over (no desktop session?); skipping this check"; exit 0 }
          $install = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          if (-not $install.WaitForExit(300000)) { throw "Installing over a running agent did not finish in 5 minutes" }
          if ($install.ExitCode -ne 0) { throw "Installing over a running agent failed (exit code $($install.ExitCode))" }
          $run = Start-Process $exe -ArgumentList "--version" -PassThru
          if (-not $run.WaitForExit(60000) -or $run.ExitCode -ne 0) { throw "The agent does not run after installing over a running one" }
          Write-Host "Installed over a running agent without any prompt"
          Get-Process WorkPulseAgent -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with:
          name: WorkPulseAgentSetup-${{ steps.version.outputs.version }}
          path: agent/dist/WorkPulseAgentSetup-${{ steps.version.outputs.version }}.exe
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/WorkPulseAgentSetup-${{ steps.version.outputs.version }}.exe" `
            --title "WorkPulse Agent ${{ steps.version.outputs.version }}" `
            --notes "WorkPulse desktop agent ${{ steps.version.outputs.version }}. Install over the old version; no uninstall needed.`n`nFor automatic updates, set on Render (backend): AGENT_VERSION=${{ steps.version.outputs.version }}, AGENT_DOWNLOAD_URL=this file's download link, AGENT_SHA256=${{ steps.hash.outputs.sha256 }}"
