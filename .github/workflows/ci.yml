# Checks every push and pull request to main. Render is set to deploy only after these pass
# ("Auto-Deploy: After CI checks pass"), so a failing change never goes live.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runs on main are never cancelled: Render deploys a commit only after its checks pass, so a cancelled run
# would leave that commit undeployed. Only pull-request runs give way to a newer push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests, ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Start MongoDB
        run: |
          # MongoDB 7.0: 8.0 refuses to start on Linux kernel 6.19+ (SERVER-121912), which the runners now use.
          # Move up once a MongoDB 8 release supports the newer kernel.
          docker run -d --name mongo -p 27017:27017 mongo:7.0
          for i in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q 1; then
              echo "MongoDB is ready"; exit 0
            fi
            sleep 2
          done
          echo "::error title=MongoDB did not start::$(docker logs mongo 2>&1 | tail -n 15 | tr '\n' ' ' | cut -c1-1500)"
          exit 1
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Types (mypy)
        run: mypy app
      - name: Tests (pytest)
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck and build
        run: npm run build
