# Rendered by the nginx image's envsubst step: ${API_UPSTREAM}, ${TRUSTED_PROXY} and ${DNS_RESOLVER} are substituted.
#
# TRUSTED_PROXY is the address of a TLS proxy in front of this server (the production compose file runs Caddy at a
# fixed internal address). Only connections from it may set the client address (X-Forwarded-For) and the original
# scheme (X-Forwarded-Proto). The default, 127.0.0.1, trusts nobody: clients can't spoof their address.

map $realip_remote_addr $forwarded_proto {
    "${TRUSTED_PROXY}" $http_x_forwarded_proto;
    default            $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Access log without query strings or referrers: WebSocket URLs carry the access token, signed file links carry
# signatures, and e-mail links (password reset, invitations) carry one-time tokens.
log_format workpulse '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_user_agent" $request_time';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    resolver_timeout 5s;

    set_real_ip_from ${TRUSTED_PROXY};
    real_ip_header X-Forwarded-For;

    access_log /var/log/nginx/access.log workpulse;
    server_tokens off;
    client_max_body_size 10m;

    # Security headers. nginx drops inherited add_header lines in any location that adds its own, so locations
    # that set headers repeat these (see /assets/ and /).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Same-origin scripts only (no inline or eval). Inline styles are allowed for component libraries that set
    # style attributes. connect-src 'self' covers the API and the same-origin WebSockets.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Behind HTTPS, also send: Strict-Transport-Security "max-age=31536000; includeSubDomains" (see docs/security.md).

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API + WebSocket gateway — same origin, so the httpOnly refresh cookie just works.
    location /api/ {
        # The upstream is a variable so nginx re-resolves the API's name (DNS_RESOLVER, Docker's by default) instead
        # of keeping the address it saw at startup: a redeployed API container gets a new address.
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace (never append to) any client-supplied X-Forwarded-For: the API trusts this header for the client
        # address used in rate limits and the audit trail. $remote_addr is the real client: either the connecting
        # address or, from TRUSTED_PROXY only, the address that proxy reported (real_ip above).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback; never cache the HTML shell.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
